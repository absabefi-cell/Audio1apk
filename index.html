<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Télécharger l’application</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #f2f4f8;
    }

    .carte {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 14px #0002;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      color: white;
      background: #1677ff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="carte">
    <h1>Application audio</h1>
    <p>Appuie sur le bouton pour télécharger le fichier APK.</p>

    <a href="audio.apk" download="audio.apk">
      Télécharger audio.apk
    </a>
  </div>
</body>
</html>
